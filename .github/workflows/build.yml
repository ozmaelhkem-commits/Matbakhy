name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project (unzip if needed)
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            Z=$(find . -maxdepth 2 -iname '*.zip' | head -n 1)
            unzip -q "$Z" -d _src
            D=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
            echo "PROJECT_DIR=$D" >> $GITHUB_ENV
          fi
      - name: Download QR libraries (bundled inside the app)
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          curl -fL -o "$PROJECT_DIR/app/src/main/assets/qrcode.min.js" https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js
          curl -fL -o "$PROJECT_DIR/app/src/main/assets/jsQR.min.js" https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: Matbakhy-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk
